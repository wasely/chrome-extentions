project_id = "watch-better"

[auth]
enabled = true
site_url = "https://github.com/wasely/chrome-extentions"
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
otp_length = 6
otp_expiry = 600
max_frequency = "60s"

[auth.email.template.magic_link]
subject = "Your Watch Better sign-in code"
content_path = "./templates/code.html"

[auth.email.template.confirmation]
subject = "Your Watch Better sign-in code"
content_path = "./templates/code.html"

[functions.delete-account]
verify_jwt = false
